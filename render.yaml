# One-click deploy of the JT Digi Dash live-data backend to Render.
# In Render: New + → "Blueprint" → connect this repo → it reads this file.
# After it deploys, add your X_BEARER_TOKEN under the service's Environment tab,
# then copy the service URL into js/config.js (API_BASE) and set DATA_MODE:"live".
services:
  - type: web
    name: jt-digi-dash-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    disk:                    # persists follower snapshots + cache across restarts
      name: jtdd-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
    envVars:
      - key: X_BEARER_TOKEN
        sync: false          # paste your X token in the Render dashboard
      - key: META_TOKEN
        sync: false          # paste your Meta Graph API token in the Render dashboard
      - key: CURRENCY_SYMBOL
        value: R
      - key: CACHE_TTL_HOURS
        value: "12"
